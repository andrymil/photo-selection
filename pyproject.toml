[project]
name = "photo-selection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black[jupyter]>=26.3.1",
    "datasets>=4.7.0",
    "grad-cam>=1.5.5",
    "imbalanced-learn>=0.14.1",
    "ipympl>=0.10.0",
    "jupyterlab>=4.5.6",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "onnx>=1.21.0",
    "onnxscript>=0.7.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.25.0",
    "torchviz>=0.0.3",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.33",
    "wandb>=0.25.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "pandas.*",
    "cv2.*",
    "tqdm.*",
    "torchvision.*",
    "seaborn.*",
    "torchviz.*",
    "pytorch_grad_cam.*",
    "ipympl.*"
]
ignore_missing_imports = true
